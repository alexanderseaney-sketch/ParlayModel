name: Refresh data

# Runs the same pulls the dashboard's "Run Data Pulls" button triggers, then
# regenerates predictions and commits whatever changed. Streamlit Community Cloud
# only ever serves what's in this repo (no storage of its own), so this is what
# keeps the deployed site current without a human clicking anything -- a push here
# triggers the same auto-redeploy a manual `git push` already does.
#
# Each pull step continues on error so one flaky source (Footballguys' backend has
# been observed to fail most individual requests, see data/pull_footballguys_depth.py)
# doesn't block the others from updating. Runs on a schedule and via workflow_dispatch
# for an on-demand trigger from the Actions tab.

"on":
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute pull years
        # --years has no default (required=True) -- reuses dashboard/utils.py's
        # _default_pull_years() rather than hardcoding years here, which is exactly
        # how this went stale before (see that function's own docstring: a
        # hardcoded ["2023","2024"] silently never covered 2025 once time passed).
        id: years
        run: |
          YEARS=$(python -c "import sys; sys.path.insert(0, 'dashboard'); from utils import _default_pull_years; print(' '.join(_default_pull_years()))")
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"

      - name: Pull nflverse (schedules + stats + NGS + injuries + snaps + rosters)
        continue-on-error: true
        run: python data/pull_nflverse.py --years ${{ steps.years.outputs.years }} --skip-pbp

      - name: Pull official team-site rosters (all 32 clubs)
        continue-on-error: true
        run: python data/pull_nfl_rosters.py

      - name: Pull coaching staff (Wikipedia)
        continue-on-error: true
        run: python data/pull_coaching_staff.py

      - name: Pull Spotrac contracts + IR (all 32 clubs)
        continue-on-error: true
        run: python data/pull_spotrac.py

      # team_scheme_tendencies.csv and coach_history.csv are NOT rebuilt here on
      # purpose: both need the full pbp.csv (not pulled with --skip-pbp) and only
      # shift on the timescale of new games / coaching changes -- manual
      # `python models/build_team_scheme_tendencies.py` / `build_coach_history.py`
      # after a pbp pull. The committed CSVs persist.

      - name: Rebuild fantasy matchups (weekly_stats only, no pbp)
        continue-on-error: true
        run: python models/build_fantasy_matchups.py

      - name: Pull SB Nation team news
        continue-on-error: true
        run: python data/pull_sbnation_news.py

      - name: Pull NBC Sports / PFT rumor mill
        continue-on-error: true
        run: python data/pull_nbcsports_news.py

      - name: Pull Footballguys depth charts
        continue-on-error: true
        run: python data/pull_footballguys_depth.py

      - name: Pull Underdog pick'em props
        continue-on-error: true
        run: python data/pull_underdog.py

      - name: Archive Underdog line changes (slim, committed -- line moves on the hosted app)
        continue-on-error: true
        run: python data/archive_underdog_lines.py

      - name: Pull weather forecasts
        continue-on-error: true
        run: python data/pull_weather_forecast.py

      - name: Regenerate current predictions
        continue-on-error: true
        run: python models/current_predictions.py

      # Every other Underdog prop type (tackles, kicking, longest plays, attempts,
      # fantasy points, 1Q/1H receptions, ...): slim box scores + play-by-play splits
      # from nflverse (~10 s), then each player's expected value per stat.
      - name: Pull prop game logs and refresh the other prop types
        continue-on-error: true
        run: |
          python data/pull_prop_game_logs.py
          python models/extra_prop_models.py

      # Re-grades every played week against real Underdog closing lines and rewrites
      # the per-stat track record the Picks screen uses to hide unproven stat types.
      # ~7 min cold, so once a week: the Tuesday 12:00 UTC run (after Monday night)
      # or any manual run.
      - name: Refresh real-line track record (weekly)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u%H)" = "212" ]; then
            # The trained TD / quarter / half models build features from play-by-play;
            # without pbp.csv their point-in-time predictions fail and drop out of the
            # grading. Last two seasons only (gitignored, never committed).
            python -c "import sys; sys.path.insert(0, 'data'); import pull_nflverse as p; p.pull_pbp([int(y) for y in '${{ steps.years.outputs.years }}'.split()][-2:])"
            python backtesting/backtest_line_history.py
            # Same-game pick links (teammates and opponents) for same game parlays, ~10 s.
            python models/build_leg_correlations.py
          else
            echo "Not the weekly slot -- skipping."
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Directory-level add, not data/raw/*.csv: naming a .gitignore'd file
          # explicitly (pbp.csv) makes `git add` exit 1 and fail the job.
          git add -A -- data/raw models/current_player_predictions.csv models/feature_importance.csv \
            backtesting/line_history_track_record.json backtesting/line_history_graded.csv \
            models/leg_correlations.csv models/real_line_adjustment.json \
            models/extra_prop_form.csv models/extra_prop_dists.json
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
          else
            git commit -m "Automated data refresh"
            git push
          fi
